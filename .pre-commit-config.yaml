repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: secret-scan
        name: Secret pattern scan
        entry: ./scripts/scan-secrets.sh
        language: system
        pass_filenames: false
